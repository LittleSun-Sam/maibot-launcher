<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!--
  ============================================================================
  内容安全策略（CSP）
  ============================================================================
  重构前完全没有 CSP：渲染层一旦被注入脚本（例如日志内容、模型返回的
  HTML），就能畅通无阻地执行。本应用会展示大量**外部文本**
  （GitHub release 说明、LLM 输出、子进程日志），所以 CSP 是必要防线。

  各项取值理由：
    default-src 'self'
        默认只允许同源资源，未显式列出的类型一律拒绝。
    script-src 'self'
        不允许内联脚本、不允许 eval —— 这是防注入的核心一条。
        Vite 生产构建产物是独立 .js 文件，满足该策略。
    style-src 'self' 'unsafe-inline'
        必须放开内联样式：Vue 单文件组件的 scoped 样式在运行时插入
        <style> 标签，xterm.js 也依赖内联样式设置终端尺寸。
    img-src 'self' data: blob:
        允许 base64/Blob 图片（图标与粘贴的截图预览）。
    font-src 'self' data:
        允许内嵌字体。
    connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https:
        开发模式需要连接 Vite dev server 的 HMR WebSocket（ws://localhost:5173）。
        注意：LLM/GitHub 的网络请求全部由**主进程**发起，渲染层不直连，
        因此 https: 仅用于兜底，实际很少使用。
    object-src 'none'; frame-src 'none'
        禁止插件与嵌套框架，进一步缩小攻击面。
    base-uri 'self'; form-action 'none'
        防止 <base> 劫持与表单外发。
  ============================================================================
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self';
           script-src 'self';
           style-src 'self' 'unsafe-inline';
           img-src 'self' data: blob:;
           font-src 'self' data:;
           connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https:;
           object-src 'none';
           frame-src 'none';
           base-uri 'self';
           form-action 'none'"
/>

<title>MaiBot Launcher</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
